name: Bug
description: Qualcosa non funziona come dovrebbe
labels: [bug]
body:
  - type: textarea
    id: cosa
    attributes:
      label: Cosa succede
      description: Descrivi il problema e cosa ti aspettavi.
    validations:
      required: true
  - type: textarea
    id: passi
    attributes:
      label: Passi per riprodurlo
      placeholder: "1. Accedi\n2. Apri #general\n3. ..."
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      placeholder: Browser, sistema operativo, versione dell'app
